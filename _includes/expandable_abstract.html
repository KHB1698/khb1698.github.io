{% assign visible_text = include.abstract | truncate: 150, '' %}
{% assign hidden_text = include.abstract | remove_first: visible_text %}

<div class="paper-abstract">
  <div class="expandable-abstract">
    <div class="abstract-summary">
      <span class="expand-btn" onclick="toggleAbstract(this)">&#9658;</span>
      <strong>Abstract:</strong> {{ visible_text }}<span class="ellipsis">...</span>
    </div>
    <div class="abstract-full" style="display: none;">
      <span class="collapse-btn" onclick="toggleAbstract(this)">&#9660;</span>
      <strong>Abstract:</strong> {{ include.abstract }}
    </div>
  </div>
</div>

<script>
if (typeof toggleAbstract === 'undefined') {
  function toggleAbstract(btn) {
    const container = btn.closest('.expandable-abstract');
    const summary = container.querySelector('.abstract-summary');
    const full = container.querySelector('.abstract-full');
    
    if (full.style.display === 'none') {
      summary.style.display = 'none';
      full.style.display = 'block';
    } else {
      summary.style.display = 'block';
      full.style.display = 'none';
    }
  }
}
</script>
